name: CI

on:
    pull_request:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install vp
              run: npm install -g vite-plus

            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            - run: pnpm test

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - run: pnpm exec playwright install --with-deps chromium

            - name: Browser tests (fixture dataset)
              run: pnpm run test:e2e

            - name: Smoke screenshots (fixture dataset)
              run: |
                  pnpm run screenshot -- --output artifacts/desktop.png --query "data=tests/fixtures/astorb-fixture.bin&t=0&cam=0,20,12&paused=1"
                  pnpm run screenshot -- --mobile --output artifacts/mobile.png --query "data=tests/fixtures/astorb-fixture.bin&t=0&paused=1"

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: smoke-screenshots
                  path: artifacts/*.png
                  if-no-files-found: ignore

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install vp
              run: npm install -g vite-plus

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - name: Audit dist/
              run: |
                  ls -laR dist
                  test -f dist/data/release/astorb3d.bin || { echo "dist/ has no dataset"; exit 1; }
                  test -f dist/data/release/astorb3d.meta.json || { echo "dist/ has no metadata"; exit 1; }
                  test -f dist/.nojekyll || { echo "dist/ has no .nojekyll"; exit 1; }
                  test -n "$(ls dist/assets/*.js 2>/dev/null)" || { echo "dist/ has no scripts"; exit 1; }
