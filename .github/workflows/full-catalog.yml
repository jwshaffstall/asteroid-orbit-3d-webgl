name: Full catalog (on demand)

# Run by hand before each release and after each data refresh. There is no schedule.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    full-catalog:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install vp
              run: npm install -g vite-plus

            - run: pnpm install --frozen-lockfile

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - run: pnpm exec playwright install --with-deps chromium

            - name: Full-catalog screenshots
              run: |
                  pnpm run screenshot -- --output artifacts/full-desktop.png --query "t=0&cam=0,20,12&paused=1"
                  pnpm run screenshot -- --output artifacts/full-top-down.png --query "t=0&cam=0,80,8&paused=1&color=4"
                  pnpm run screenshot -- --mobile --output artifacts/full-mobile.png --query "t=0&paused=1"

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: full-catalog-screenshots
                  path: artifacts/*.png
                  if-no-files-found: ignore
